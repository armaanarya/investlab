[project]
name = "investlab"
version = "0.1.0"
description = "Decision support for the DECA Stock Market Game and Wharton WInS competitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "yfinance>=1.7.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.8",
    "matplotlib>=3.9",
    "python-dateutil>=2.9",
    "pandas-market-calendars>=4.4",
]

[project.scripts]
investlab = "investlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
