[project]
name = "investlab"
version = "0.1.0"
description = "Decision support for the DECA Stock Market Game and Wharton WInS competitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "yfinance>=1.7.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.8",
    "matplotlib>=3.9",
    "python-dateutil>=2.9",
    "pandas-market-calendars>=4.4",
]

[project.scripts]
investlab = "investlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "DTZ", "FURB"]
ignore = [
    # typer.Option/Argument in argument defaults is Typer's documented API,
    # not a mutable-default bug.
    "B008",
    # Decimal("100000") over Decimal(100000). Verbose, but it keeps every
    # money literal in one form, so a value copied from a rules document is
    # never silently switched to a float constructor.
    "FURB157",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
